<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Evento</title>
</head>
<body>

    <h1>Cadastrar Produto</h1>
    <form th:action="@{/salvar-peca}" method="post">
        <div>
            <label>Nome da peça</label>
            <input type="text" name="nomePeca" >
        </div>
        <div>
            <label>Corrente</label>
            <input step="0.1" type="number" name="corrente">
        </div>
        <div>
            <label>Categoria</label>
            <input type="text" name="categoria">
        </div>
        <div>
            <label>Quantidade em estoque</label>
            <input type="number" name="quantidadeEstoque">
        </div>
        <div>
            <label>Tensão</label>
            <select name="tensao">
                <option value="110">110V</option>
                <option value="220">220V</option>
            </select>
        </div>
        <button type="submit">Cadastrar Peça</button>
    </form>

    <div th:if="${sucesso}">
        <h2>Peça cadastrada!</h2>
        <p>Peça: <span th:text="${nomePeca}"></span></p>
        <p>Corrente: <span th:text="${corrente}"></span></p>
        <p>Categoria: <span th:text="${categoria}"></span></p>
        <p>Quantidade em estoque: <span th:text="${quantidadeEstoque}"></span></p>
        <p>Tensão: <span th:text="${tensao}"></span></p>

    </div>

</body>
</html>
